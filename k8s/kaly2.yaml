apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaly2
spec:
  # Robot sessions live in memory, so run a single copy
  replicas: 1
  selector:
    matchLabels:
      app: kaly2
  template:
    metadata:
      labels:
        app: kaly2
    spec:
      containers:
        - name: kaly2
          image: kaly2:local
          ports:
            - containerPort: 9000
          # The same as kaly2 gets on Cloud Run
          resources:
            limits:
              cpu: "4"
              memory: 2Gi
            # GitHub's machines have 4 CPUs, some of them taken by the cluster itself
            requests:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: kaly2
spec:
  selector:
    app: kaly2
  ports:
    - port: 9000

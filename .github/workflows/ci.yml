# Same file in jatjat/joelathiessen.ca and jatjat/kaly2. On every push: build this
# repo's app (the other repo's comes from the registry when it's already been built),
# run both together on a throwaway Kubernetes cluster and test the robot demo.
# kaly2 builds with Bazel, which also runs its unit tests.
# Then branches get a preview, and master deploys. Deleting a branch removes its preview.
name: CI

on:
  push:
    branches: ["**"]
  delete:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Repository secrets so GitHub hides them in the public logs
  PROJECT: ${{ secrets.GCP_PROJECT }}
  PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
  BUCKET: ${{ secrets.GCP_PRIVATE_BUCKET }}

jobs:
  test-together:
    name: Build and test website with kaly2
    if: github.event_name != 'delete'
    runs-on: ubuntu-24.04
    # A newer push to a branch replaces its older run, which could otherwise finish last and
    # overwrite the preview and branch image with older code. Master runs all finish.
    concurrency:
      group: test-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    outputs:
      website: ${{ steps.refs.outputs.website }}
      slug: ${{ steps.refs.outputs.slug }}
    steps:
      # Creating the cluster takes ~40 s, so it boots while the image builds. GitHub's
      # machines come with kind.
      - name: Start a throwaway Kubernetes cluster in the background
        run: |
          setsid nohup bash -c "kind create cluster --name ci --wait 180s; echo \$? > '$RUNNER_TEMP/kind.exit'" \
            > "$RUNNER_TEMP/kind.log" 2>&1 < /dev/null &
          # The end-to-end test runs in this image
          setsid nohup docker pull -q node:22.20.0-alpine > /dev/null 2>&1 < /dev/null &

      - name: Pick versions to test together
        id: refs
        # This commit, plus the other repo's branch of the same name if it has
        # one (for changes that span both repos), otherwise its master
        run: |
          pick() {
            if [ "$GITHUB_REPOSITORY" = "jatjat/$1" ]; then echo "$GITHUB_SHA"
            elif git ls-remote --exit-code --heads "https://github.com/jatjat/$1" "$GITHUB_REF_NAME" >/dev/null; then echo "$GITHUB_REF_NAME"
            else echo master; fi
          }
          website=$(pick joelathiessen.ca); kaly2=$(pick kaly2)
          # Branch name as used in preview links; keep in sync with scripts/git-hooks/pre-push
          slug=$(printf %s "$GITHUB_REF_NAME" | tr A-Z a-z | tr -c a-z0-9 - | cut -c1-28 | sed 's/-*$//')
          if [ "$GITHUB_REPOSITORY" = jatjat/kaly2 ]; then this=kaly2; other=website; other_ref=$website
          else this=website; other=kaly2; other_ref=$kaly2; fi
          # The other repo's image as its own CI last built it for that branch
          other_tag=$([ "$other_ref" = master ] && echo master || echo "branch-$slug")
          printf '%s\n' "website=$website" "kaly2=$kaly2" "slug=$slug" "this=$this" "other=$other" "other_tag=$other_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: jatjat/joelathiessen.ca
          ref: ${{ steps.refs.outputs.website }}
          path: website
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: jatjat/kaly2
          ref: ${{ steps.refs.outputs.kaly2 }}
          path: kaly2
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ci-build@${{ secrets.GCP_PROJECT }}.iam.gserviceaccount.com
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Use the other repo's image if its CI already built it
        id: reuse
        env:
          THIS: ${{ steps.refs.outputs.this }}
          OTHER: ${{ steps.refs.outputs.other }}
          OTHER_TAG: ${{ steps.refs.outputs.other_tag }}
        run: |
          if docker pull -q "us-central1-docker.pkg.dev/$PROJECT/site/$OTHER:$OTHER_TAG"; then
            docker tag "us-central1-docker.pkg.dev/$PROJECT/site/$OTHER:$OTHER_TAG" "$OTHER:local"
            build_other=false
            # Load it into the cluster as soon as the cluster is up, while this repo's image builds
            setsid nohup bash -c "until [ -f '$RUNNER_TEMP/kind.exit' ]; do sleep 1; done; \
              kind load docker-image '$OTHER:local' --name ci; echo \$? > '$RUNNER_TEMP/other.loaded'" \
              > "$RUNNER_TEMP/other-load.log" 2>&1 < /dev/null &
          else
            echo "No $OTHER:$OTHER_TAG in the registry yet, so it gets built from source"
            build_other=true
          fi
          echo "build_other=$build_other" >> "$GITHUB_OUTPUT"
          # The images this run builds: this repo's, plus the other one if it can't be reused
          for app in website kaly2; do
            echo "build_$app=$([ "$app" = "$THIS" ] || [ "$build_other" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          done

      # gcloud comes with GitHub's machines and uses the sign-in above
      - name: Fetch files kept out of git
        env:
          BUILD_WEBSITE: ${{ steps.reuse.outputs.build_website }}
          BUILD_KALY2: ${{ steps.reuse.outputs.build_kaly2 }}
        run: |
          if [ "$BUILD_WEBSITE" = true ]; then
            gcloud storage cp "gs://$BUCKET/public/res.pdf" website/server/public/
          fi
          if [ "$BUILD_KALY2" = true ]; then
            gcloud artifacts files download org/jetbrains/exposed/exposed/0.8.6/exposed-0.8.6.jar --repository legacy-maven \
              --location us-central1 --project "$PROJECT" --destination kaly2/core/lib --local-filename exposed-0.8.6.jar
            echo "d1b7af584e7a526be2a50353d3a88ad1e6a858913745f2fc1d1aa450b09003dd  kaly2/core/lib/exposed-0.8.6.jar" | sha256sum -c -
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.reuse.outputs.build_website == 'true'
        with:
          # The runner is thrown away anyway; skips ~15 s of teardown
          cleanup: false

      # Layers are cached in GitHub's cache, so packages only reinstall when lockfiles change
      - name: Build the website image
        if: steps.reuse.outputs.build_website == 'true'
        uses: docker/build-push-action@v7
        with:
          context: website
          tags: website:local
          load: true
          cache-from: type=gha,scope=website
          cache-to: ${{ steps.refs.outputs.this == 'website' && 'type=gha,mode=max,scope=website' || '' }}

      # The website's own CI also checks it keeps running when kaly2 can't be reached
      - name: Test the website with kaly2 unreachable
        if: steps.refs.outputs.this == 'website'
        run: |
          docker run -d --name website-no-kaly2 --network host -e PORT=3102 \
            -e WS_ADDR=ws://127.0.0.1:9/api/ws/robot website:local
          docker run --rm --network host -v "$PWD/website/ci:/ci:ro" node:22.20.0-alpine \
            node /ci/website-server-test.mjs

      # Saved again only when kaly2's dependencies or Bazel settings change
      - name: Restore Bazel's tools
        if: steps.reuse.outputs.build_kaly2 == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-tools
          key: bazel-tools-${{ hashFiles('kaly2/.bazelrc', 'kaly2/.bazelversion', 'kaly2/MODULE.bazel', 'kaly2/MODULE.bazel.lock', 'kaly2/maven_install.json') }}

      # The last run's outputs, so only changed code recompiles
      - name: Restore Bazel's build outputs
        if: steps.reuse.outputs.build_kaly2 == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-outputs
          key: bazel-outputs-${{ github.sha }}
          restore-keys: bazel-outputs-

      - name: Build kaly2's image
        if: steps.reuse.outputs.build_kaly2 == 'true'
        working-directory: kaly2
        env:
          THIS: ${{ steps.refs.outputs.this }}
        run: |
          touch "$RUNNER_TEMP/bazel-start"
          # Its unit tests run in its own CI
          if [ "$THIS" = kaly2 ]; then bazel test --config=ci //...; fi
          bazel run --config=ci //core:image_load
          # Bazel marks the outputs it used; keep only those, so the saved cache doesn't keep growing
          find ~/.cache/bazel-outputs -type f ! -newer "$RUNNER_TEMP/bazel-start" -delete

      - name: Wait for the cluster
        run: |
          for i in $(seq 1 240); do [ -f "$RUNNER_TEMP/kind.exit" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/kind.log"
          [ "$(cat "$RUNNER_TEMP/kind.exit" 2>/dev/null)" = 0 ]

      - name: Run both on Kubernetes
        env:
          THIS: ${{ steps.refs.outputs.this }}
          OTHER: ${{ steps.refs.outputs.other }}
          BUILT_OTHER: ${{ steps.reuse.outputs.build_other }}
        run: |
          if [ "$BUILT_OTHER" = true ]; then
            kind load docker-image "$THIS:local" "$OTHER:local" --name ci
          else
            kind load docker-image "$THIS:local" --name ci
            until [ -f "$RUNNER_TEMP/other.loaded" ]; do sleep 1; done
            cat "$RUNNER_TEMP/other-load.log"; [ "$(cat "$RUNNER_TEMP/other.loaded")" = 0 ]
          fi
          kubectl apply -f kaly2/k8s/kaly2.yaml -f website/k8s/website.yaml
          kubectl rollout status deploy/kaly2 --timeout=180s
          kubectl rollout status deploy/website --timeout=180s

      - name: Test the robot demo end to end
        run: |
          kubectl port-forward svc/website 3000:3000 &
          sleep 3
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null http://localhost:3000/public/res.pdf
          docker run --rm --network host -v "$PWD/website/ci:/ci:ro" node:22.20.0-alpine \
            node /ci/robot-demo-test.mjs ws://localhost:3000

      - name: Show app logs
        if: failure()
        run: |
          kubectl logs deploy/kaly2 --tail=50 || true
          kubectl logs deploy/website --tail=50 || true
          docker logs website-no-kaly2 --tail=30 || true
          tail -20 "$RUNNER_TEMP/kind.log" || true

      - name: Push this repo's image
        env:
          IMG: ${{ steps.refs.outputs.this }}
          SLUG: ${{ steps.refs.outputs.slug }}
          OTHER: ${{ steps.refs.outputs.other }}
          OTHER_TAG: ${{ steps.refs.outputs.other_tag }}
          BUILT_OTHER: ${{ steps.reuse.outputs.build_other }}
        run: |
          reg="us-central1-docker.pkg.dev/$PROJECT/site"
          # The branch tag lets the other repo's CI reuse this image for a same-named branch
          tag=$([ "$GITHUB_REF" = refs/heads/master ] && echo master || echo "branch-$SLUG")
          for t in "$GITHUB_SHA" "$tag"; do
            docker tag "$IMG:local" "$reg/$IMG:$t"
            docker push -q "$reg/$IMG:$t"
          done
          # A same-named branch of the other repo built here goes up too, for the preview
          if [ "$BUILT_OTHER" = true ] && [ "$OTHER_TAG" != master ]; then
            docker tag "$OTHER:local" "$reg/$OTHER:$OTHER_TAG"
            docker push -q "$reg/$OTHER:$OTHER_TAG"
          fi

      # Branch pushes get a preview, in this same job (same account) to skip a second job's startup
      - id: secrets
        if: github.ref != 'refs/heads/master' && github.event_name == 'push'
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: site_key:${{ secrets.GCP_PROJECT }}/site-key

      - name: Deploy a preview and test it
        if: github.ref != 'refs/heads/master' && github.event_name == 'push'
        env:
          SLUG: ${{ steps.refs.outputs.slug }}
          SITE_KEY: ${{ steps.secrets.outputs.site_key }}
          OTHER_TAG: ${{ steps.refs.outputs.other_tag }}
        run: |
          cr() { gcloud run "$@" --project "$PROJECT" --region us-central1 --quiet; }
          reg="us-central1-docker.pkg.dev/$PROJECT/site"
          host() { echo "https://$1---$2-$PROJECT_NUMBER.us-central1.run.app"; }
          # kaly2's simulation needs 2 CPUs to take about 25 steps a second
          # Like the test above, a same-named branch of the other repo is paired with this one
          if [ "$GITHUB_REPOSITORY" = jatjat/kaly2 ]; then
            # This kaly2 branch, with a copy of the live website (or its same-named branch)
            tag="k-$SLUG"; kind=kaly2
            cr deploy kaly2-preview --image "$reg/kaly2:$GITHUB_SHA" --tag "$tag" --no-traffic --cpu 2
            kaly2_url=$(host "$tag" kaly2-preview)
            website_image="$reg/website:$OTHER_TAG"
          else
            # This website branch, talking to the live kaly2 (or a copy of its same-named branch)
            tag="w-$SLUG"; kind=website
            if [ "$OTHER_TAG" = master ]; then
              kaly2_url="https://kaly2-$PROJECT_NUMBER.us-central1.run.app"
            else
              cr deploy kaly2-preview --image "$reg/kaly2:$OTHER_TAG" --tag "$tag" --no-traffic --cpu 2
              kaly2_url=$(host "$tag" kaly2-preview)
            fi
            website_image="$reg/website:$GITHUB_SHA"
          fi
          cr deploy website-preview --image "$website_image" --tag "$tag" --no-traffic \
            --update-env-vars "WS_ADDR=${kaly2_url/https/wss}/api/ws/robot"
          url=$(host "$tag" website-preview)
          curl -fsS -o /dev/null -H "x-site-key: $SITE_KEY" "$url/"
          docker run --rm -e SITE_KEY -v "$PWD/website/ci:/ci:ro" node:22.20.0-alpine \
            node /ci/robot-demo-test.mjs "${url/https/wss}"
          echo "Preview: https://joelathiessen.ca/share/$kind/$SLUG/" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Cloud Run
    needs: test-together
    if: github.ref == 'refs/heads/master' && github.event_name != 'delete'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    env:
      SITE_URL: https://website-${{ secrets.GCP_PROJECT_NUMBER }}.us-central1.run.app
    steps:
      # For the end-to-end test script
      - uses: actions/checkout@v7
        with:
          repository: jatjat/joelathiessen.ca
          ref: master
          path: website
          persist-credentials: false

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ci-deploy-prod@${{ secrets.GCP_PROJECT }}.iam.gserviceaccount.com

      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: site_key:${{ secrets.GCP_PROJECT }}/site-key

      # GitHub's machines come with gcloud, which uses the sign-in above
      - name: Deploy, test the live site, roll back if the test fails
        env:
          SITE_KEY: ${{ steps.secrets.outputs.site_key }}
        run: |
          svc=$([ "$GITHUB_REPOSITORY" = jatjat/kaly2 ] && echo kaly2 || echo website)
          # kaly2's simulation needs 2 CPUs to take about 25 steps a second
          cpu=$([ "$svc" = kaly2 ] && echo 2 || echo 1)
          cr() { gcloud run "$@" --project "$PROJECT" --region us-central1 --quiet; }
          before=$(cr services describe "$svc" --format='value(status.traffic[0].revisionName)')
          cr deploy "$svc" --image "us-central1-docker.pkg.dev/$PROJECT/site/$svc:$GITHUB_SHA" --cpu "$cpu"
          cr services update-traffic "$svc" --to-latest
          if curl -fsS -o /dev/null -H "x-site-key: $SITE_KEY" "$SITE_URL/" && \
             docker run --rm -e SITE_KEY -v "$PWD/website/ci:/ci:ro" node:22.20.0-alpine \
               node /ci/robot-demo-test.mjs "${SITE_URL/https/wss}"; then
            echo "The live site works with the new $svc"
          else
            echo "The live site test failed, so $svc goes back to $before"
            cr services update-traffic "$svc" --to-revisions "$before=100"
            exit 1
          fi

  remove-preview:
    name: Remove the preview
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ci-build@${{ secrets.GCP_PROJECT }}.iam.gserviceaccount.com

      # GitHub's machines come with gcloud, which uses the sign-in above
      - name: Remove the deleted branch's preview
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          cr() { gcloud run "$@" --project "$PROJECT" --region us-central1 --quiet; }
          slug=$(printf %s "$BRANCH" | tr A-Z a-z | tr -c a-z0-9 - | cut -c1-28 | sed 's/-*$//')
          if [ "$GITHUB_REPOSITORY" = jatjat/kaly2 ]; then
            cr services update-traffic kaly2-preview --remove-tags "k-$slug" || true
            cr services update-traffic website-preview --remove-tags "k-$slug" || true
          else
            cr services update-traffic website-preview --remove-tags "w-$slug" || true
            cr services update-traffic kaly2-preview --remove-tags "w-$slug" || true
          fi
